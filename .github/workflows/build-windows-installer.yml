
name: Build Atelpix Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: atelpix_team_release
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build application
        working-directory: atelpix_team_release
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Atelpix Secure Dashboard" --collect-all cryptography --collect-all argon2 --collect-all PIL --hidden-import zoneinfo main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create Installer
        working-directory: atelpix_team_release
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Atelpix-Windows-Installer
          path: atelpix_team_release/installer-output/Atelpix-Secure-Client-Dashboard-Setup.exe
          if-no-files-found: error
