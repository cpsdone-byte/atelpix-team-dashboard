name: Build Atelpix Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Run automated tests
        run: |
          python -m pytest -q

      - name: Build application
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Atelpix Secure Dashboard" --paths . --collect-submodules atelpix --collect-all cryptography --collect-all argon2 --collect-all PIL --hidden-import atelpix --hidden-import atelpix.app --hidden-import atelpix.team_viewer --hidden-import zoneinfo main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import atelpix.app, atelpix.team_viewer; print('Atelpix package imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Atelpix-Windows-Installer
          path: installer-output/Atelpix-Secure-Client-Dashboard-Setup.exe
          if-no-files-found: error
