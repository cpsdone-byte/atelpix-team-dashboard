name: Build ATELPIX World Clock for Windows

on:
  push:
    branches:
      - atelpix-world-clock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: world-clock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools and time-zone database
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build standalone Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ATELPIX-World-Clock --collect-all tzdata --collect-all PIL app.py

      - name: Package app and quick-start guide
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/ATELPIX-World-Clock.exe package/
          Copy-Item QUICK-START.txt package/
          Compress-Archive -Path package/* -DestinationPath ATELPIX-World-Clock-Windows.zip -Force

      - name: Upload ready-to-run Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ATELPIX-World-Clock-Windows
          path: world-clock/ATELPIX-World-Clock-Windows.zip
          if-no-files-found: error
          retention-days: 30
